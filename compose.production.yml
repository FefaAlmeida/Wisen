name: wisen-production
x-app: &app
  init: true
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env.production}
  networks: [private]
  logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
services:
  database:
    <<: *app
    env_file: []
    image: pgvector/pgvector:pg17
    mem_limit: 512m
    environment:
      POSTGRES_USER: wisen
      POSTGRES_DB: wisen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    image: ${WISEN_BACKEND_IMAGE:?Configure WISEN_BACKEND_IMAGE}
    restart: "no"
    mem_limit: 384m
    command: node backend/src/database/migrate.js
    depends_on:
      database: { condition: service_healthy }
  bootstrap:
    <<: *app
    image: ${WISEN_BACKEND_IMAGE:?Configure WISEN_BACKEND_IMAGE}
    restart: "no"
    profiles: [tools]
    mem_limit: 384m
    command: node backend/src/database/bootstrap-production.js
  backend:
    <<: *app
    image: ${WISEN_BACKEND_IMAGE:?Configure WISEN_BACKEND_IMAGE}
    mem_limit: 384m
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      database: { condition: service_healthy }
  prepare-model:
    <<: *app
    image: ${WISEN_AI_IMAGE:?Configure WISEN_AI_IMAGE}
    user: root
    restart: "no"
    profiles: [tools]
    mem_limit: 1g
    cpus: 0.75
    command: sh -c 'node ai/src/prepare-model.js && chown -R node:node /models'
    volumes: [model-cache:/models]
  ai:
    <<: *app
    image: ${WISEN_AI_IMAGE:?Configure WISEN_AI_IMAGE}
    mem_limit: 1g
    cpus: 0.75
    stop_grace_period: 45s
    volumes: [model-cache:/models]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/wisen-worker-ready','utf8'))<20000?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 45s
  frontend:
    init: true
    restart: unless-stopped
    image: ${WISEN_FRONTEND_IMAGE:?Configure WISEN_FRONTEND_IMAGE}
    mem_limit: 512m
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8080/api
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      private: { ipv4_address: 172.30.70.10 }
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    ports: [127.0.0.1:7170:3000]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  private:
    ipam: { config: [{ subnet: 172.30.70.0/24 }] }
volumes:
  postgres-data:
  model-cache:
