name: wisen-production
x-environment: &environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo de ambiente}
  FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL}
  OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:?Defina OPERATIONS_TOKEN}
  MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/models}
  PORT: ${PORT:-8080}
  TRUST_PROXY: ${TRUST_PROXY:-}
services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend: { condition: service_started }
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ., target: backend }
    env_file: ${ENV_FILE:-.env.production}
    environment: *environment
    command: node backend/src/database/migrate.js
    depends_on:
      database: { condition: service_healthy }
  backend:
    build: { context: ., target: backend }
    init: true
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment: *environment
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8080}:${PORT:-8080}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  prepare-model:
    build: { context: ., target: ai }
    user: root
    profiles: [tools]
    env_file: ${ENV_FILE:-.env.production}
    environment: *environment
    command: sh -c 'node ai/src/prepare-model.js && chown -R node:node "$$MODEL_CACHE_DIR"'
    volumes: ["model-cache:${MODEL_CACHE_DIR:-/models}"]
  ai:
    mem_limit: ${AI_MEMORY_LIMIT:-1536m}
    cpus: ${AI_CPU_LIMIT:-2}
    build: { context: ., target: ai }
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ${ENV_FILE:-.env.production}
    environment: *environment
    volumes: ["model-cache:${MODEL_CACHE_DIR:-/models}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/wisen-worker-ready','utf8'))<20000?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
  frontend:
    build:
      context: .
      target: frontend
    init: true
    restart: unless-stopped
    environment:
      PORT: ${FRONTEND_PORT:-3000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:?Defina BACKEND_INTERNAL_URL}
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:${FRONTEND_PORT:-3000}"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  model-cache:
