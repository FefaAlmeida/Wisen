name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wisen
          POSTGRES_PASSWORD: wisen_local
          POSTGRES_DB: wisen
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U wisen -d wisen"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://wisen:wisen_local@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration:local
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
