name: wisen
x-app: &app
  build: { context: ., target: development }
  image: wisen-development
  init: true
  working_dir: /app
  environment: &environment
    NODE_ENV: ${NODE_ENV:-development}
    DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
    FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL no .env}
    PORT: ${PORT:-8080}
    OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:?Defina OPERATIONS_TOKEN no .env}
    TRUST_PROXY: ${TRUST_PROXY:-}
    MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/models}
    NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
  volumes:
    - .:/app
    - node-modules:/app/node_modules
    - model-cache:${MODEL_CACHE_DIR:-/models}
services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${DATABASE_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
  dependencies:
    <<: *app
    profiles: [tools]
    command: node scripts/install-dependencies.js
  migrate:
    <<: *app
    profiles: [tools]
    command: node backend/src/database/migrate.js
    depends_on:
      database: { condition: service_healthy }
  backend:
    <<: *app
    env_file: ${ENV_FILE:-.env}
    command: npm run dev -w @wisen/backend
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8080}:${PORT:-8080}"]
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    <<: *app
    command: npm run dev -w @wisen/frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:?Defina BACKEND_INTERNAL_URL}
      PORT: ${FRONTEND_PORT:-3000}
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/frontend/.next
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:${FRONTEND_PORT:-3000}"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:' + process.env.PORT).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 15s
      retries: 15
  ai:
    env_file: ${ENV_FILE:-.env}
    mem_limit: ${AI_MEMORY_LIMIT:-1536m}
    cpus: ${AI_CPU_LIMIT:-2}
    <<: *app
    command: npm run dev -w @wisen/ai
    stop_grace_period: 45s
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/wisen-worker-ready','utf8'))<20000?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
volumes:
  postgres-data:
  node-modules:
  next-cache:
  model-cache:
