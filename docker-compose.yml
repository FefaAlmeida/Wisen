name: wisen
x-app: &app
  build: { context: ., target: development }
  image: wisen-development
  init: true
  working_dir: /app
  environment: &environment
    NODE_ENV: development
    DATABASE_URL: postgres://wisen:wisen_local@database:5432/wisen
    FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-3000}
    PORT: 8080
    MODEL_CACHE_DIR: /models
    NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_HOST_PORT:-8080}/api
    NEXT_TELEMETRY_DISABLED: "1"
  volumes:
    - .:/app
    - node-modules:/app/node_modules
    - model-cache:/models
services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wisen
      POSTGRES_PASSWORD: wisen_local
      POSTGRES_DB: wisen
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${DATABASE_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wisen -d wisen"]
      interval: 3s
      timeout: 3s
      retries: 20
  dependencies:
    <<: *app
    profiles: [tools]
    command: node scripts/install-dependencies.js
  migrate:
    <<: *app
    profiles: [tools]
    command: node backend/src/database/migrate.js
    depends_on:
      database: { condition: service_healthy }
  backend:
    <<: *app
    command: npm run dev -w @wisen/backend
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"]
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    <<: *app
    command: npm run dev -w @wisen/frontend
    environment:
      <<: *environment
      WATCHPACK_POLLING: "true"
      PORT: 3000
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/frontend/.next
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 15s
      retries: 15
  ai:
    mem_limit: ${AI_MEMORY_LIMIT:-1536m}
    cpus: 2
    <<: *app
    command: npm run dev -w @wisen/ai
    stop_grace_period: 45s
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/wisen-worker-ready','utf8'))<20000?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
volumes:
  postgres-data:
  node-modules:
  next-cache:
  model-cache:
